<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firm Dashboard | Diabonds Ventures</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
<div id="global-loader">
  <div class="spinner"></div>
  <div class="loader-text">SYNCING LEDGER...</div>
</div>
  <nav class="navbar">
    <a href="./index.html" class="logo">
      <div class="logo-circle"></div>
      <span class="logo-text">DIABONDS VENTURES</span>
    </a>
    <div class="nav-links">
      <a href="firm.html">Overview</a>
      <a href="./clientDaashboard.html">Login</a>
    </div>
  </nav>

<!-- =====================================
       TOP SECTION: TOTAL PERFORMANCE
       ===================================== -->
  <main style="max-width: 1200px; margin: 0 auto 4rem auto; padding: 0 2rem;">
    
    <h1 class="hero-title" style="font-size: 3.5rem; margin-top: 0; margin-bottom: 2.5rem; text-align: center; line-height: 1.2;">Total Performance</h1>
    
    <!-- ADDED SAFE CLASS: dashboard-layout-grid -->
    <div class="dashboard-layout-grid" style="display: grid; grid-template-columns: 1.8fr 1fr; gap: 3rem; height: 320px;">
      
      <!-- Chart -->
      <div style="height: 100%; width: 100%; background: #fff; border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03); box-sizing: border-box;">
        <canvas id="firm-chart"></canvas>
      </div>

      <!-- Stats -->
      <div class="summary-card" style="margin: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; padding: 3rem;">
        <div id="firm-total-aum" style="display: none;"></div>
        <div class="card-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem 1.5rem;">
          <div>
            <span class="stat-label" style="color: #A3A3A3; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px;">1D RETURN</span>
            <span class="stat-val text-green" id="firm-1d" style="font-size: 2.5rem; font-weight: 700; margin-top: 0.5rem; display: block;">--%</span>
          </div>
          <div>
            <span class="stat-label" style="color: #A3A3A3; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px;">1W RETURN</span>
            <span class="stat-val text-green" id="firm-1w" style="font-size: 2.5rem; font-weight: 700; margin-top: 0.5rem; display: block;">--%</span>
          </div>
          <div>
            <span class="stat-label" style="color: #A3A3A3; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px;">1M RETURN</span>
            <span class="stat-val" id="firm-1m" style="font-size: 2.5rem; font-weight: 700; margin-top: 0.5rem; display: block;">--%</span>
          </div>
          <div>
            <span class="stat-label" style="color: #A3A3A3; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px;">ALL TIME</span>
            <span class="stat-val" id="firm-max" style="font-size: 2.5rem; font-weight: 700; margin-top: 0.5rem; display: block;">--%</span>
          </div>
        </div>
      </div>
      
    </div>
  </main>

  <!-- =====================================
       BOTTOM SECTION: INSTITUTIONAL X-RAY
       ===================================== -->
  <section style="max-width: 1200px; margin: 0 auto 5rem auto; padding: 0 2rem;">
    
    <!-- ADDED SAFE CLASS: dashboard-layout-grid -->
    <div class="dashboard-layout-grid" style="display: grid; grid-template-columns: 1fr 2.5fr; gap: 2rem; align-items: start;">
      
      <!-- Chart -->
      <div style="background-color: #fff; border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03); height: 440px; display: flex; flex-direction: column;">
        <h3 class="stat-label" style="color: #1A1A1A; margin-bottom: 1.5rem;" id="chart-title">ASSET CLASS ALLOCATION</h3>
        <div style="flex-grow: 1; position: relative;">
          <canvas id="firm-allocation-chart"></canvas>
        </div>
      </div>

      <!-- Table (ADDED SAFE CLASS: scrollable-table-card) -->
      <div class="scrollable-table-card" style="background-color: #fff; border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 class="page-title" style="margin: 0; font-size: 1.5rem; text-decoration: none;">Institutional Holdings</h2>
          <button id="view-toggle-btn" class="institutional-btn">View Detailed Assets</button>
        </div>
        <div id="table-header-container"></div>
        <div id="firm-assets-container" class="custom-scrollbar" style="overflow-y: auto; max-height: 340px; padding-right: 10px;"></div>
      </div>
      
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

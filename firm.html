<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firm Dashboard | Dia Ventures</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <nav class="navbar">
    <a href="./index.html" class="logo">
      <div class="logo-circle"></div>
      <span class="logo-text">DIABONDS VENTURES</span>
    </a>
    <div class="nav-links">
      <a href="firm.html">Firm Overview</a>
      <a href="./clientDaashboard.html">Client Portal</a>
    </div>
  </nav>

  <!-- Reusing your hero layout for a split-screen look -->
  <main class="hero-bottom" style="align-items: center;">
    
    <!-- Left Side: Chart -->
    <div class="hero-text" style="flex-grow: 1; padding-right: 4rem; max-width: none;">
      <h1 class="hero-title" style="font-size: 4.5rem; margin-bottom: 2rem;">Total<br>Performance</h1>
      <div style="height: 380px; width: 100%; background: #fff; border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
        <canvas id="firm-chart"></canvas>
      </div>
    </div>

    <!-- Right Side: Dark Summary Card -->
    <div class="summary-card">
      <div class="card-top">
        <span class="card-label">TOTAL FIRM AUM</span>
        <span class="badge">LIVE</span>
      </div>
      
      <h2 class="card-value" id="firm-total-aum">₹0.00</h2>
      
      <!-- Overriding the flex layout to a 2x2 grid for the 4 metrics -->
      <div class="card-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
        <div>
          <span class="stat-label">1D RETURN</span>
          <span class="stat-val text-green" id="firm-1d">--%</span>
        </div>
        <div>
          <span class="stat-label">1W RETURN</span>
          <span class="stat-val text-green" id="firm-1w">--%</span>
        </div>
        <div>
          <span class="stat-label">1M RETURN</span>
          <span class="stat-val" id="firm-1m">--%</span>
        </div>
        <div>
          <span class="stat-label">ALL TIME</span>
          <span class="stat-val" id="firm-max">--%</span>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diabonds Ventures</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  
  <!-- Navigation -->
  <nav class="navbar">
    <a href="./index.html">
    <div class="logo">
      <div class="logo-circle nav-links"></div>
      <span class="logo-text">DIABONDS VENTURES</span>
    </div></a>
    <div class="nav-links">
      <a href="./firm.html">Dashboard</a>
      <a href="./portfolios.html">Portfolios</a>
      <a href="./login.html">Login</a>
    </div>
  </nav>

  <!-- Main Hero Section -->
  <main class="hero">
    <h1 class="hero-title">Diabonds Ventures<br>hypothetical portfolio</h1>
    
    <div class="hero-bottom">
      
      <!-- Left: Description -->
      <div class="hero-text">
        <p>A consolidated view of cash, equities, bonds, and real estate, with a live performance chart and the current total portfolio value.</p>
        <a href="#explore" class="scroll-link">SCROLL TO EXPLORE &darr;</a>
      </div>
      
   <!-- Right Column: Systematic Asset Table with Toggle -->
      <div style="background-color: #fff; border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
        
        <!-- Header Controls -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <h2 class="page-title" style="margin: 0; font-size: 1.5rem; text-decoration: none;">Institutional Holdings</h2>
          <button id="view-toggle-btn" class="institutional-btn">View Detailed Assets</button>
        </div>

        <!-- NEW: Mobile Scroll Wrapper -->
        <div class="table-scroll-wrapper">
          
          <!-- Dynamic Table Header -->
          <div id="table-header-container">
            <!-- Injected via JavaScript -->
          </div>
          
          <!-- Scrollable container for the rows -->
          <div id="firm-assets-container" class="custom-scrollbar" style="overflow-y: auto; max-height: 340px; padding-right: 10px;">
            <!-- JavaScript will inject the asset rows here -->
          </div>
          
        </div> <!-- End Mobile Scroll Wrapper -->

      </div>
      
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

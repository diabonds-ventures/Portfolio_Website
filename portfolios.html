<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolios | Diabonds Ventures</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- 1. The Loading Screen -->
  <div id="global-loader">
    <div class="spinner"></div>
    <div class="loader-text">SYNCING LEDGER...</div>
  </div>

  <!-- 2. Navigation -->
  <nav class="navbar">
    <a href="./index.html" class="logo">
      <div class="logo-circle"></div> 
      <span class="logo-text">DIABONDS VENTURES</span>
    </a>
    <div class="nav-links">
      <a href="firm.html">Firm Dashboard</a>
      <a href="portfolios.html">Portfolios</a>
      <a href="login.html">Client Login</a>
    </div>
  </nav>

  <!-- 3. Main Content Area -->
  <main class="portfolio-section">
    <h1 class="page-title">Portfolios</h1>
    
    <!-- The Column Headers -->
    <div class="table-header dia-grid">
      <div>Name</div>
      <div>1D %</div>
      <div>1W %</div>
      <div>1M %</div>
      <div>MAX %</div>  
      <div>TREND</div>
    </div>

    <!-- The Drop Zone for JavaScript -->
    <div id="portfolio-rows-container">
      <!-- JavaScript will automatically generate the <a class="table-row"> blocks and put them here -->
    </div>
    
  </main>

  <!-- 4. Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>

</html>

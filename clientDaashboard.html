<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio | Diabonds Ventures</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="global-loader">
  <div class="spinner"></div>
  <div class="loader-text">SYNCING LEDGER...</div>
</div>

  <nav class="navbar">
    <div class="logo">
      <div class="logo-circle"></div>
      <span class="logo-text" id="client-greeting">Welcome, Client</span>
    </div>
    <div class="nav-links">
      <a href="#" id="logout-btn" style="color: #DC2626;">Secure Logout</a>
    </div>
  </nav>

  <main>
    <!-- Top Section: Full Width Dark Card -->
    <div class="summary-card" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 3rem 4rem; margin-bottom: 2rem;">
      
      <!-- Left side: Value -->
      <div>
        <div class="card-top" style="justify-content: flex-start; gap: 1rem; margin-bottom: 1rem;">
          <span class="card-label">CURRENT PORTFOLIO VALUE</span>
          <span class="badge" id="client-strategy">Strategy</span>
        </div>
        <h2 class="card-value" id="client-gross-value" style="margin-bottom: 0;">₹0.00</h2>
        <div style="margin-top: 1rem; color: #888; font-size: 0.95rem; font-weight: 600;">
          Net Withdrawal (After 5% Fee): <span id="client-net-value" style="color: #fff; margin-left: 8px;">₹0.00</span>
        </div>
      </div>

      <!-- Right side: Metrics -->
      <div class="card-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem;">
        <div>
          <span class="stat-label">1D RETURN</span>
          <span class="stat-val" id="client-1d">--%</span>
        </div>
        <div>
          <span class="stat-label">1W RETURN</span>
          <span class="stat-val" id="client-1w">--%</span>
        </div>
        <div>
          <span class="stat-label">1M RETURN</span>
          <span class="stat-val" id="client-1m">--%</span>
        </div>
        <div>
          <span class="stat-label">ALL TIME</span>
          <span class="stat-val" id="client-max">--%</span>
        </div>
      </div>
    </div>

    <!-- Bottom Section: Charts -->
    <div class="client-charts-grid">
      <div class="chart-box">
        <h3 class="stat-label" style="color: #1A1A1A; margin-bottom: 1.5rem;">PERFORMANCE HISTORY</h3>
        <div class="canvas-wrapper">
          <canvas id="client-line-chart"></canvas>
        </div>
      </div>
      
      <div class="chart-box">
        <h3 class="stat-label" style="color: #1A1A1A; margin-bottom: 1.5rem;">ASSET ALLOCATION</h3>
        <div class="canvas-wrapper">
          <canvas id="client-allocation-chart"></canvas>
        </div>
      </div>
    </div>
    <!-- =====================================
       ASSET HOLDINGS TABLE (FULL WIDTH)
       ===================================== -->
  <section style="max-width: 1200px; margin: 2rem auto 5rem auto; padding: 0 2rem; width: 100%; box-sizing: border-box; clear: both;">
    
    <!-- ADDED SAFE CLASS: scrollable-table-card -->
    <div class="scrollable-table-card" style="background-color: #fff; border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03); width: 100%;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 class="page-title" style="margin: 0; font-size: 1.5rem; text-decoration: none;">Portfolio Holdings</h2>
        <button id="client-view-toggle-btn" class="institutional-btn">View Detailed Assets</button>
      </div>

      <div id="client-table-header-container"></div>
      
      <div id="client-assets-container" class="custom-scrollbar" style="overflow-y: auto; max-height: 400px; padding-right: 10px;"></div>

    </div>
  </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
